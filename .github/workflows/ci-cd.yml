on:
  push:
    branches:
      - master

env:
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE: backend:latest
  FRONTEND_IMAGE: frontend:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - uses: actions/checkout@v3

      # Setup Docker Buildx
      - uses: docker/setup-buildx-action@v2

      # Build backend and frontend Docker images
      - run: docker build -t $BACKEND_IMAGE ./backend
      - run: docker build -t $FRONTEND_IMAGE ./frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Checkout the repository
      - uses: actions/checkout@v3

      # Setup Docker Buildx (needed to use Docker Compose plugin)
      - uses: docker/setup-buildx-action@v2

      # List files to verify docker-compose.yml exists
      - run: ls -l

      # Deploy using Docker Compose plugin
      - run: docker compose -f docker-compose.yml up -d --build
