name: Build and Run Locally

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          registry: docker.io

      - name: Build backend docker image
        run: docker build -t paris-backend:latest ./backend

      - name: Push backend docker image
        run: docker push ghaitho20/paris-backend:latest


      - name: Build frontend docker image
        run: docker build -t paris-frontend:latest ./frontend

      - name: Push frontend docker image
        run: docker push paris-frontend:latest

      - name: Run docker-compose (test locally)
        run: |
          docker compose pull
          docker compose up -d
          docker ps
